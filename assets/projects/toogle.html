<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/toogle.css" />
    <link rel="shortcut icon" href="../images/feedbacklogo.ico" type="image/x-icon">
    <title>Toogle</title>
  </head>
  <body>
    <h2>How good is this project?</h2>
    <div class="toggle-container">
      <input type="checkbox" id="good" class="toggle">
      <label for="good" class="label">
        <div class="ball"></div>
      </label>
      <span>Good</span>
    </div>

    <div class="toggle-container">
      <input type="checkbox" id="awesome" class="toggle">
      <label for="awesome" class="label">
        <div class="ball"></div>
      </label>
      <span>Awesome</span>
    </div>

    <div class="toggle-container">
      <input type="checkbox" id="best" class="toggle">
      <label for="best" class="label">
        <div class="ball"></div>
      </label>
      <span>Best</span>
    </div>
    <script src="../js/toogle.js"></script>
  </body>
</html>
